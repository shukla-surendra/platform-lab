site_name: ml_fundamentals
# "." not "docs" -- content files sit directly alongside this mkdocs.yml,
# not under a nested docs/ subfolder. (The sibling
# 00_prerequisite_concepts/mkdocs.yml this was modeled on has the same
# "docs_dir: docs" line pointing at a docs/ folder that doesn't exist there
# either -- that config appears to have never actually been built
# standalone. Fixed here since this one is used for real strict-build
# anchor verification.)
docs_dir: .
site_dir: site

validation:
  links:
    # Part 7/README intentionally link out to
    # ../system_design_foundation/01_ml_system_design/11_llmops.md, outside
    # this narrow single-tree docs_dir -- resolves fine in the real
    # top-level fundamentals/mkdocs.yml build, but this standalone config
    # can't see it. Same pattern fundamentals/mkdocs.yml itself already
    # uses for the same reason.
    not_found: info

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

# No explicit nav: MkDocs auto-generates it from docs/'s directory tree.
# Add a hand-curated 'nav:' section here later if a specific order/grouping is wanted --
# see fundamentals/mkdocs.yml or system_design_foundation/00_prerequisite_concepts/mkdocs.yml
# for worked examples of that pattern.
