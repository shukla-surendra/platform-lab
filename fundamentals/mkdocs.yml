site_name: Engineering Notebook — Interview Prep
site_description: Algorithms & data structures, ML/LLM and distributed systems design, security engineering, and low-level design — one site, organized by track.
docs_dir: docs
site_dir: site

validation:
  links:
    # A few pages intentionally link out to mlops_aiops/docs and k8n_explorer content
    # alongside docs_dir (e.g. tool write-ups, a KServe example) — those resolve fine on
    # GitHub but aren't part of this site's own docs_dir, so don't fail --strict builds
    # over them (same pattern genai_lab/mkdocs.yml already uses).
    not_found: info

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["dsa_prep", "lld"]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

