{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rust-sqlite-api-stack.fullname" . }}
  labels:
    {{- include "rust-sqlite-api-stack.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "rust-sqlite-api-stack.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      # The writer flushes every 250ms by default. A 60s scrape averages away
      # the bursts that matter — a queue spike that causes drops can be over
      # long before the next sample. Keep this well under a minute, and read
      # telemetry_dropped_total (a counter, which cannot be missed) rather than
      # telemetry_queue_depth (a gauge, which can) when diagnosing loss.
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
