# ---------------------------------------------------------------------------
# The application
# ---------------------------------------------------------------------------
nameOverride: rust-api      # so resources read <release>-rust-api
fullnameOverride: ""

image:
  repository: surendrashukla29/rust-api
  tag: "1.0.0"        # pinned; also matches .Chart.AppVersion in Chart.yaml
  pullPolicy: IfNotPresent

# rust-api is fully stateless — no database, no volume, no coordination needed
# between replicas. Unlike the OTLP-collector version this chart used to run,
# there is no reason to cap this at 1; a Deployment with N replicas behind the
# Service just works, and is a reasonable thing to demonstrate on this cluster.
replicaCount: 1

service:
  # NodePort so the API is reachable without a port-forward, matching how
  # Grafana is exposed in this chart. Use ClusterIP on any real cluster —
  # NodePort opens the port on every node, with no auth in front of it.
  type: NodePort
  port: 8080

  # Pinned rather than auto-assigned, so the URL survives a reinstall and can
  # be written down. Kubernetes restricts node ports to 30000-32767 by default
  # (--service-node-port-range), which is why this cannot literally be 8080:
  # the SERVICE port is 8080, the NODE port is 30080.
  #
  # Set to null to let the API server pick a free one — do that if 30080 is
  # already taken, since a collision fails the install rather than falling back.
  nodePort: 30080

  annotations: {}

config:
  # `info` alone makes this service almost silent: it logs a couple of lines
  # at startup and then nothing until something goes wrong. tower-http's
  # request tracing emits at DEBUG, so with plain `info` the logs dashboard —
  # and the request-rate/status/latency panels on the main dashboard, which
  # are computed FROM those request-tracing lines via LogQL — are permanently
  # empty and look broken when they are merely accurate. See
  # ../docs/metrics-and-logs-without-instrumentation.md for why those panels
  # can exist at all without the app exposing a /metrics endpoint.
  rustLog: info,tower_http=debug

  # Seconds between "alive" heartbeat log lines. The heartbeat exists so an
  # empty log panel means something: without it, "healthy and quiet" and
  # "wedged" produce identical output, and you cannot tell the log pipeline is
  # working until something goes wrong.
  heartbeatSecs: 30

resources:
  requests:
    cpu: 20m            # a stateless HTTP handler, genuinely light
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true    # the app writes nothing anywhere
  capabilities:
    drop: ["ALL"]

probes:
  # Liveness deliberately hits /healthz, which does NOT touch the database.
  # A liveness probe that fails on a busy database restarts the pod, which
  # unlocks nothing and drops every in-flight request.
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 15
    failureThreshold: 3
  # Readiness hits /readyz, which does query the database — an instance that
  # cannot reach its own storage should leave the Service, not be killed.
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Observability wiring owned by this chart
# ---------------------------------------------------------------------------
#
# rust-api has NO /metrics endpoint — see
# ../docs/metrics-and-logs-without-instrumentation.md for the full reasoning,
# verified live against this exact deployment. In short:
#   - logs need nothing from the app: stdout capture is automatic (Promtail)
#   - pod-level metrics (CPU, memory, restarts) come from cAdvisor and
#     kube-state-metrics, already scraped by kube-prometheus-stack for every
#     pod on the cluster — zero setup specific to this app
#   - request-level metrics (rate, status, latency) are computed from the
#     existing tower_http access-log lines via LogQL, in Grafana panels, not
#     from Prometheus at all
# A ServiceMonitor pointed at this app's :8080/metrics would 404 forever, so
# it stays off. The template is still here — flip it on if a future version
# of the app ever adds a real /metrics endpoint.
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

# Off by default for the same reason: there is no telemetry_* metric left to
# alert on. What ships when enabled is deliberately small and honest — real
# signals from kube-state-metrics/cAdvisor, not placeholders.
prometheusRule:
  enabled: false
  labels: {}

grafanaDashboard:
  enabled: true
  label: grafana_dashboard      # what the kube-prometheus-stack sidecar watches
  labelValue: "1"
  folder: ""

# Only for pointing Grafana at a Loki that this chart did NOT deploy.
#
# Off by default because loki-stack.enabled is on, and that subchart ships its
# own datasource. Turn this on (and loki-stack off) to reuse a Loki that already
# exists elsewhere in the cluster — e.g. ../grafana-log-viewer, which installs
# one into the log-viewer namespace:
#   --set loki-stack.enabled=false \
#   --set externalLoki.enabled=true \
#   --set externalLoki.url=http://log-viewer-loki.log-viewer.svc.cluster.local:3100
externalLoki:
  enabled: false
  name: Loki
  url: ""

# ---------------------------------------------------------------------------
# Subcharts
# ---------------------------------------------------------------------------
kube-prometheus-stack:
  enabled: true

  # Alertmanager off by default: nothing here routes anywhere on a practice
  # cluster, and it is the second-largest consumer of minikube's CPU budget.
  alertmanager:
    enabled: false

  prometheus:
    prometheusSpec:
      # WITHOUT THIS, NOTHING IS SCRAPED.
      #
      # kube-prometheus-stack defaults to selecting only ServiceMonitors
      # carrying its own release label. This chart's ServiceMonitor is its own
      # object, so the default silently ignores it — Prometheus comes up
      # healthy, the target list is empty, and every dashboard panel reads
      # "No data" with no error anywhere to explain why.
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      retention: 24h
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      storageSpec: {}      # emptyDir; practice cluster, 24h retention

  grafana:
    enabled: true
    adminPassword: admin          # practice cluster only
    defaultDashboardsEnabled: true
    service:
      type: NodePort              # minikube service <release>-grafana
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        # Watch every namespace so the dashboard ConfigMap is found even when
        # the app and Grafana are installed into different ones.
        searchNamespace: ALL
      datasources:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

  # Trimmed for minikube: these scrape control-plane endpoints that either do
  # not exist or are not reachable on a single-node local cluster, and each
  # failing target is noise that makes a real failure harder to spot.
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

loki-stack:
  # ON by default. This chart's whole point is that one `helm install` produces
  # a collector you can see — and half of "see" is logs, which need Loki and
  # Promtail. Defaulting this off means the logs dashboard is empty on a fresh
  # install with nothing to say why, and `helm upgrade -f values.yaml` silently
  # UNINSTALLS Loki for anyone who enabled it with --set.
  #
  # Turn off only when the cluster already runs Loki, and pair it with
  # externalLoki.enabled=true so Grafana still gets a datasource.
  enabled: true
  grafana:
    enabled: false      # never a second Grafana
  prometheus:
    enabled: false      # kube-prometheus-stack owns Prometheus

  loki:
    # MUST BE false. This subchart ships its own Grafana datasource ConfigMap
    # and marks it default — but kube-prometheus-stack's Prometheus datasource
    # is ALSO default, and Grafana refuses to start with two:
    #   "Datasource provisioning error: only one datasource per organization
    #    can be marked as default"
    # Grafana then CrashLoopBackOffs, taking down the dashboards for a reason
    # that has nothing to do with them.
    isDefault: false
    datasource:
      # Pinned so it matches the uid the logs dashboard references. Left to
      # Grafana's own generated uid, every log panel renders empty with no error.
      uid: loki

  promtail:
    config:
      # MUST BE OVERRIDDEN. The upstream loki-stack default is
      # `http://{{ .Release.Name }}:3100/...`, which assumes the Loki Service is
      # named exactly the release. It is not — the Loki subchart names it
      # `<release>-loki`. With the default, Promtail starts healthy (1/1
      # Running, no errors in its log at default verbosity) and posts every
      # batch into the void: Loki holds zero streams and every Grafana log
      # panel is empty with no error shown anywhere.
      #
      # This exact failure is on record for this cluster already — see
      # ../grafana-log-viewer/README.md and ../docs/incidents.md.
      #
      # The key is config.clients[0].url (not lokiAddress, which is the newer
      # standalone promtail chart's spelling and is silently ignored here).
      # The value is passed through `tpl`, so Release.Name resolves.
      clients:
        - url: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push

      snippets:
        # MUST MATCH THE CLUSTER'S CONTAINER RUNTIME.
        #
        # The runtime wraps every stdout line in its own envelope before
        # Promtail sees it. Docker writes {"log":"…","stream":"stdout","time":…};
        # containerd/CRI writes `<ts> stdout F <line>`. The pipeline stage
        # unwraps it, and the wrong one leaves the wrapper in place.
        #
        # Consequence if wrong: logs still arrive in Loki and look fine in the
        # Live stream panel, but `| json` parses the WRAPPER, so `level` is
        # always empty — the level filter matches nothing and "Error lines"
        # reads 0 no matter how many errors there are. A dashboard that is
        # confidently wrong, rather than visibly broken.
        #
        # `docker: {}` for the Docker runtime (minikube's default driver here);
        # `cri: {}` for containerd — the upstream default. Check with:
        #   kubectl get node -o jsonpath='{.items[0].status.nodeInfo.containerRuntimeVersion}'
        pipelineStages:
          - docker: {}
