apiVersion: batch/v1
kind: Job
metadata:
  name: flaky-job
  labels:
    app: job-demo
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: job-demo
    spec:
      restartPolicy: Never
      containers:
      - name: flaky
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          echo "Attempt at $(date -Iseconds), failing on purpose..."
          exit 1
