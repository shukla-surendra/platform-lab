apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-work
  labels:
    app: job-demo
spec:
  completions: 6
  parallelism: 3
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: job-demo
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          echo "Worker $(hostname) picked up one unit of work at $(date -Iseconds)"
          sleep 5
