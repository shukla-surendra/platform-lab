apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-demo
  namespace: kuberay
spec:
  rayVersion: "2.40.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        nodeSelector:
          kubernetes.io/hostname: minikube
        containers:
          - name: ray-head
            image: rayproject/ray:2.40.0
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "2Gi"
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
  workerGroupSpecs:
    - groupName: small-group
      replicas: 0
      minReplicas: 0
      maxReplicas: 2
      rayStartParams: {}
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: minikube
          containers:
            - name: ray-worker
              image: rayproject/ray:2.40.0
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
