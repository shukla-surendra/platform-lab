        - |
          # the app answers on / and on /api (a file named "api"), so both host- and path-based routing can be tested
          echo "api app, answered by pod $(hostname)" > /usr/share/nginx/html/index.html
          cp /usr/share/nginx/html/index.html /usr/share/nginx/html/api
          nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: ingress-p1
spec:
  type: NodePort
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30103
