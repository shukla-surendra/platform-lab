# PROBLEM lab: three apps (shop, blog, api), each exposed to the outside with its OWN NodePort Service.
# This is what you end up with when each app needs to be reachable from outside and you only have Services.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-p1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: ingress-p1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - |
          # the app answers on / and on /shop (a file named "shop"), so both host- and path-based routing can be tested
          echo "shop app, answered by pod $(hostname)" > /usr/share/nginx/html/index.html
          cp /usr/share/nginx/html/index.html /usr/share/nginx/html/shop
          nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: shop-svc
  namespace: ingress-p1
spec:
  type: NodePort
  selector:
    app: shop
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: ingress-p1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - |
          # the app answers on / and on /blog (a file named "blog"), so both host- and path-based routing can be tested
          echo "blog app, answered by pod $(hostname)" > /usr/share/nginx/html/index.html
          cp /usr/share/nginx/html/index.html /usr/share/nginx/html/blog
          nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: blog-svc
  namespace: ingress-p1
spec:
  type: NodePort
  selector:
    app: blog
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30102
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ingress-p1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: web
