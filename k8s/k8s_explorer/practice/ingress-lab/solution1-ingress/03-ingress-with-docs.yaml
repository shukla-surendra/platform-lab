# The SAME Ingress "site", with one more rule: docs.local -> docs-svc.
# Applying this adds a 4th app to the outside world without any new port or load balancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: ingress-s1
spec:
  ingressClassName: nginx
  rules:
  - host: shop.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-svc
            port:
              number: 80
  - host: blog.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blog-svc
            port:
              number: 80
  - host: docs.local            # <- the only new rule
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docs-svc
            port:
              number: 80
