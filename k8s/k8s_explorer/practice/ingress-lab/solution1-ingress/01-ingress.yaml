# THE FIX: one Ingress = one set of routing rules, served by ONE entry point (the ingress controller).
#   shop.local          -> shop-svc          (host-based routing)
#   shop.local/api      -> api-svc           (path-based routing, on the same host)
#   blog.local          -> blog-svc
# Anything that matches no rule gets the controller's default 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: ingress-s1
spec:
  ingressClassName: nginx        # which controller should implement these rules (minikube's addon creates "nginx")
  rules:
  - host: shop.local
    http:
      paths:
      - path: /api               # more specific path first (not required, but easier to read)
        pathType: Prefix         # matches /api and /api/anything
        backend:
          service:
            name: api-svc        # a Service in the SAME namespace as the Ingress
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-svc
            port:
              number: 80
  - host: blog.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blog-svc
            port:
              number: 80
