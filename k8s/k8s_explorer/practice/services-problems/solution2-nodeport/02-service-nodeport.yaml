# THE FIX: the SAME Service (same name), with type changed to NodePort.
# Kubernetes opens one port on EVERY node. Anything that can reach a node's IP can now reach the backend at
#   http://<node-ip>:30080
# A NodePort Service still has its ClusterIP too, so callers inside the cluster keep working unchanged.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: solution2
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 80            # the Service's own (ClusterIP) port, for callers inside the cluster
    targetPort: 80      # the container's port
    nodePort: 30080     # the port opened on every node. Must be 30000-32767.
                        # Leave this line out to let Kubernetes pick a free one.
