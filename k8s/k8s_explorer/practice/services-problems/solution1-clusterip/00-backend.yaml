# The BACKEND for the solution lab (same as problem1's, but in its own namespace, so this folder
# is fully independent). 3 copies (Pods) of a tiny web server.
# Each Pod answers "Hello from <its own pod name>", so you can see WHICH Pod replied.
# Everything lives in its own namespace (solution1) so cleanup is one command.
apiVersion: v1
kind: Namespace
metadata:
  name: solution1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: solution1
spec:
  replicas: 3                  # keep 3 Pods alive; if one dies, create a replacement
  selector:
    matchLabels:
      app: backend             # "the Pods I manage are the ones labelled app=backend"
  template:
    metadata:
      labels:
        app: backend           # every Pod made from this template gets this label
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Hello from $(hostname)" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'
