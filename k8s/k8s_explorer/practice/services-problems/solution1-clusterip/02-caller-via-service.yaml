# The CALLER, solution version: it calls the Service NAME, not any Pod IP.
# Every 2 seconds it prints which backend Pod replied (or FAILED).
apiVersion: v1
kind: Pod
metadata:
  name: caller-service
  namespace: solution1
spec:
  restartPolicy: Never
  containers:
  - name: caller
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      while true; do
        if out=$(wget -T 2 -qO- http://backend-svc); then echo "$(date +%T) OK     $out"
        else echo "$(date +%T) FAILED calling backend-svc"; fi
        sleep 2
      done
