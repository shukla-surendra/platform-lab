apiVersion: v1
kind: Pod
metadata:
  name: toygpu-consumer-1
  labels:
    app: toygpu-consumer
spec:
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        limits:
          example.com/toygpu: 1
