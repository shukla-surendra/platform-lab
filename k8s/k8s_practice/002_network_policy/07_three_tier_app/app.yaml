# A three-tier app in np-07-app (web -> api -> db) and a client in np-07-outside.
apiVersion: v1
kind: Namespace
metadata: {name: np-07-app}
---
apiVersion: v1
kind: Namespace
metadata: {name: np-07-outside}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: np-07-app, labels: {app: web}}
spec:
  containers: [{name: nginx, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: np-07-app}
spec: {selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: np-07-app, labels: {app: api}}
spec:
  containers: [{name: nginx, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: np-07-app}
spec: {selector: {app: api}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: db, namespace: np-07-app, labels: {app: db}}
spec:
  containers: [{name: redis, image: "redis:7-alpine", ports: [{containerPort: 6379}]}]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: np-07-app}
spec: {selector: {app: db}, ports: [{port: 6379}]}
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: np-07-outside, labels: {app: client}}
spec:
  containers: [{name: shell, image: "busybox:1.36", command: ["sleep", "infinity"]}]
