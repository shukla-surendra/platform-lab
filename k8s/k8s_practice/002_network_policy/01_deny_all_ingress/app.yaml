# A web server and a client, both in namespace np-01.
apiVersion: v1
kind: Namespace
metadata: {name: np-01}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: np-01, labels: {app: web}}
spec:
  containers: [{name: nginx, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: np-01}
spec: {selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: np-01, labels: {app: client}}
spec:
  containers: [{name: shell, image: "busybox:1.36", command: ["sleep", "infinity"]}]
