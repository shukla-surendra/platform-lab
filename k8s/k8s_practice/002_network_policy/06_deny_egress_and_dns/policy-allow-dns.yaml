# Add-on: let the client look up names with cluster DNS (CoreDNS in kube-system), on port 53.
# Policies add up, so the client may now do DNS, and still nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-allow-dns
  namespace: np-06
spec:
  podSelector:
    matchLabels: {app: client}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
