# An api server and two clients in namespace np-02: "frontend" (should get in) and "stranger" (shouldn't).
apiVersion: v1
kind: Namespace
metadata: {name: np-02}
---
apiVersion: v1
kind: Pod
metadata: {name: api, namespace: np-02, labels: {app: api}}
spec:
  containers: [{name: nginx, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: np-02}
spec: {selector: {app: api}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: frontend, namespace: np-02, labels: {app: frontend}}
spec:
  containers: [{name: shell, image: "busybox:1.36", command: ["sleep", "infinity"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: stranger, namespace: np-02, labels: {app: stranger}}
spec:
  containers: [{name: shell, image: "busybox:1.36", command: ["sleep", "infinity"]}]
