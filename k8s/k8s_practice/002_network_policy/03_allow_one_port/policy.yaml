# The server accepts traffic from anyone, but ONLY on port 80. Port 8080 (admin) is closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-allow-port-80
  namespace: np-03
spec:
  podSelector:
    matchLabels: {app: server}
  policyTypes: [Ingress]
  ingress:
    - ports:                 # no "from:" here, so the source can be anyone ...
        - protocol: TCP
          port: 80           # ... but only this port is open
