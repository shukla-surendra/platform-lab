# A web server in np-04-app, and one client in each of two other namespaces:
# np-04-trusted (should get in) and np-04-untrusted (shouldn't).
apiVersion: v1
kind: Namespace
metadata: {name: np-04-app}
---
apiVersion: v1
kind: Namespace
metadata: {name: np-04-trusted}
---
apiVersion: v1
kind: Namespace
metadata: {name: np-04-untrusted}
---
apiVersion: v1
kind: Pod
metadata: {name: web, namespace: np-04-app, labels: {app: web}}
spec:
  containers: [{name: nginx, image: "nginx:1.27-alpine", ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: np-04-app}
spec: {selector: {app: web}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: np-04-trusted, labels: {app: client}}
spec:
  containers: [{name: shell, image: "busybox:1.36", command: ["sleep", "infinity"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: np-04-untrusted, labels: {app: client}}
spec:
  containers: [{name: shell, image: "busybox:1.36", command: ["sleep", "infinity"]}]
