apiVersion: v1
kind: Service
metadata:
  name: {{ include "pa.fullname" . }}-frontend
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app: {{ include "pa.fullname" . }}-frontend
  {{- if eq .Values.frontend.service.type "LoadBalancer" }}
  annotations:
    # Newer replacement for the deprecated spec.loadBalancerIP field --
    # tells AKS's cloud-controller-manager to attach this exact existing
    # Public IP (created in the node resource group by infra/main.tf)
    # instead of provisioning a fresh one.
    service.beta.kubernetes.io/azure-load-balancer-ipv4: {{ .Values.frontend.service.loadBalancerIP | quote }}
  {{- end }}
spec:
  selector:
    app: {{ include "pa.fullname" . }}-frontend
  ports:
    - port: 80
      targetPort: 80
  type: {{ .Values.frontend.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pa.fullname" . }}-frontend
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app: {{ include "pa.fullname" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "pa.fullname" . }}-frontend
  template:
    metadata:
      labels:
        app: {{ include "pa.fullname" . }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            # Consumed by nginx.conf.template's envsubst at container start --
            # this is how the frontend reaches the backend without any URL
            # baked into the JS bundle at build time.
            - name: BACKEND_HOST
              value: {{ include "pa.fullname" . }}-backend
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
