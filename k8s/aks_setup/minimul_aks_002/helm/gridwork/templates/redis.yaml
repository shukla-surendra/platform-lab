apiVersion: v1
kind: Service
metadata:
  name: {{ include "pa.fullname" . }}-redis
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app: {{ include "pa.fullname" . }}-redis
spec:
  selector:
    app: {{ include "pa.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pa.fullname" . }}-redis
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app: {{ include "pa.fullname" . }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "pa.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "pa.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
