apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pa.fullname" . }}-secrets
  labels:
    {{- include "pa.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  # JWT_SECRET matches config.py's `jwt_secret` field (the one authorization/auth.py
  # and adapters/auth/jwt_adapter.py actually sign/verify with) -- config.py also
  # has JWT_SECRET_KEY/SECRET_KEY fields, but nothing in the codebase reads them.
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
