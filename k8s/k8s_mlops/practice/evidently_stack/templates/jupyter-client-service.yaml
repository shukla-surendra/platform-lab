# NodePort so JupyterLab's UI is reachable from a host browser -- same
# reasoning as evidently-server-service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "evidently-stack.jupyter-client.fullname" . }}
  labels:
    app.kubernetes.io/name: jupyter-client
    {{- include "evidently-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.jupyterClient.service.type }}
  selector:
    app.kubernetes.io/name: jupyter-client
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.jupyterClient.service.port }}
      targetPort: http
      {{- if and (eq .Values.jupyterClient.service.type "NodePort") .Values.jupyterClient.service.nodePort }}
      nodePort: {{ .Values.jupyterClient.service.nodePort }}
      {{- end }}
