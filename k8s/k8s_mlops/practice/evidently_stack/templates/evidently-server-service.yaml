# NodePort so *you* can reach the Evidently UI from a host browser -- has no
# bearing on how jupyter-client reaches this Service (that's plain in-cluster
# DNS, see jupyter-client-deployment.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "evidently-stack.evidently-server.fullname" . }}
  labels:
    app.kubernetes.io/name: evidently-server
    {{- include "evidently-stack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.evidentlyServer.service.type }}
  selector:
    app.kubernetes.io/name: evidently-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.evidentlyServer.service.port }}
      targetPort: http
      {{- if and (eq .Values.evidentlyServer.service.type "NodePort") .Values.evidentlyServer.service.nodePort }}
      nodePort: {{ .Values.evidentlyServer.service.nodePort }}
      {{- end }}
