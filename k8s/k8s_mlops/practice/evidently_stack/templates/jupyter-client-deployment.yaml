apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evidently-stack.jupyter-client.fullname" . }}
  labels:
    app.kubernetes.io/name: jupyter-client
    {{- include "evidently-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jupyter-client
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jupyter-client
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: jupyter-client
          image: "{{ .Values.jupyterClient.image.repository }}:{{ .Values.jupyterClient.image.tag }}"
          imagePullPolicy: {{ .Values.jupyterClient.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
          env:
            # Computed from evidently-server's own templated Service name --
            # same release, so this can never drift out of sync the way a
            # manually-set value across two separate `helm install`s could.
            # Read by the notebook via os.environ["EVIDENTLY_SERVER_URL"].
            - name: EVIDENTLY_SERVER_URL
              value: "http://{{ include "evidently-stack.evidently-server.fullname" . }}:{{ .Values.evidentlyServer.service.port }}"
            - name: JUPYTER_TOKEN
              value: {{ .Values.jupyterClient.jupyterToken | quote }}
          resources:
            {{- toYaml .Values.jupyterClient.resources | nindent 12 }}
