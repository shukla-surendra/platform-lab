apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evidently-stack.evidently-server.fullname" . }}
  labels:
    app.kubernetes.io/name: evidently-server
    {{- include "evidently-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evidently-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evidently-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: evidently-server
          image: "{{ .Values.evidentlyServer.image.repository }}:{{ .Values.evidentlyServer.image.tag }}"
          imagePullPolicy: {{ .Values.evidentlyServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          # /api/version is the same endpoint Evidently's own CLI polls to
          # detect readiness (see evidently/cli/ui.py) -- not guessed.
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.evidentlyServer.resources | nindent 12 }}
      volumes:
        - name: workspace
          {{- if .Values.evidentlyServer.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "evidently-stack.evidently-server.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
