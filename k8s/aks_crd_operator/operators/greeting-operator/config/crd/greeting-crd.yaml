# Hand-written -- unlike the Go/Kubebuilder path (webapp_types.go markers +
# `make manifests`), kopf has no schema-from-code generator, so this OpenAPI
# schema is authored directly instead of derived. See ../../README.md for
# the field design and ../../../../docs/02-crd-design.md for why a CRD is
# what makes `Greeting` a real, `kubectl get`-able kind.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greetings.greeting.platformlab.dev
spec:
  group: greeting.platformlab.dev
  scope: Namespaced
  names:
    kind: Greeting
    listKind: GreetingList
    plural: greetings
    singular: greeting
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.name
        - name: ConfigMap
          type: string
          jsonPath: .status.configMapName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Who the greeting is for.
                message:
                  type: string
                  default: "Hello, {name}!"
                  description: >-
                    Template rendered by the operator; "{name}" is
                    substituted with spec.name.
            status:
              type: object
              properties:
                configMapName:
                  type: string
                  description: The ConfigMap this Greeting produced.
                observedGeneration:
                  type: integer
                  format: int64
                  description: >-
                    metadata.generation last reconciled -- lets `kubectl
                    get greeting` distinguish "caught up" from "stale."
