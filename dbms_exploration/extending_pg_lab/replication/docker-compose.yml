services:
  primary:
    image: postgres:18
    container_name: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: replica_lab
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql
      - ./primary/init-replica-user.sh:/docker-entrypoint-initdb.d/init-replica-user.sh:ro

  replica1:
    image: postgres:18
    container_name: pg-replica1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: replica_lab
      PGPASSWORD: replpass
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    depends_on:
      - primary
    ports:
      - "5433:5432"
    volumes:
      - replica1_data:/var/lib/postgresql
      - ./replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro

  replica2:
    image: postgres:18
    container_name: pg-replica2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: replica_lab
      PGPASSWORD: replpass
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    depends_on:
      - primary
    ports:
      - "5434:5432"
    volumes:
      - replica2_data:/var/lib/postgresql
      - ./replica/replica-entrypoint.sh:/replica-entrypoint.sh:ro

volumes:
  primary_data:
  replica1_data:
  replica2_data:
