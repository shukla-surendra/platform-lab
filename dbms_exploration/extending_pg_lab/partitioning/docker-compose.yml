services:

  postgres:
    image: postgres:17
    container_name: postgres-partitioning
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partition_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_partition_data:/var/lib/postgresql/data

volumes:
  postgres_partition_data:
