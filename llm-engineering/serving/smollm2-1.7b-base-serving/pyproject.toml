[project]
name = "smollm2-1.7b-base-serving"
version = "0.1.0"
description = "Serves the ORIGINAL, unmodified SmolLM2-1.7B base checkpoint (no LoRA adapter, no chat template) as its own endpoint"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[tool.uv]
package = false
