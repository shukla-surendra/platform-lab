[project]
name = "batch-drift-detection-xgboost"
version = "0.1.0"
description = "Batch drift-detection pipeline: synthetic data -> XGBoost -> persisted model -> generate drifted batches (data drift + concept drift) -> Evidently"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "evidently",
    "mlflow",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
