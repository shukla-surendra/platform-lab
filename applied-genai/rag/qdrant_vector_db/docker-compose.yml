services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"  # REST API + web UI at http://localhost:6333/dashboard
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  qdrant_data:
