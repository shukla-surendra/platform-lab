services:
  api:
    build:
      context: .
      args:
        VERSION: "0.2.0"
    image: rust-sqlite-api:0.2.0
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      DB_POOL_SIZE: "8"
    volumes:
      # Named volume, not a bind mount: it inherits /data's uid 10001 ownership
      # from the image, so the non-root process can write without a host chown.
      - api-data:/data
    restart: unless-stopped
    # SQLite is a file on local disk — this container cannot be scaled to more
    # than one replica against the same volume without corrupting writes.
    deploy:
      replicas: 1

volumes:
  api-data:
