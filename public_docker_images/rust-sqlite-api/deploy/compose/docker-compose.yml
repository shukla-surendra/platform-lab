# Local observability stack: the collector, Prometheus scraping it, and Grafana
# with the dashboard pre-provisioned. Pulls the published image rather than
# building, so this also proves the public image works from a clean pull.
#
#   docker compose up -d
#   open http://localhost:3000   (anonymous admin, no login)
#
services:
  api:
    image: surendrashukla29/rust-sqlite-api:0.2.0
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      # Small queue on purpose: makes backpressure and drops reachable with a
      # modest load generator, so the dashboard's loss panels are demonstrable
      # rather than theoretical.
      INGEST_QUEUE_CAPACITY: "2000"
    volumes:
      - api-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      # Local lab only — never do this anywhere reachable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../../k8s_explorer/rust-sqlite-api-stack/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  api-data:
  prom-data:
  grafana-data:
