global:
  # 5s rather than the usual 15s: the writer flushes every 250ms, so a coarse
  # scrape smooths away exactly the bursts this dashboard exists to show.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rust-sqlite-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: rust-sqlite-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
