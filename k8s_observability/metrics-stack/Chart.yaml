apiVersion: v2
name: metrics-stack
description: Prometheus + Grafana (via kube-prometheus-stack) for cluster and workload metrics — metrics only, no logs, no traces
type: application
version: 0.2.0
appVersion: "88.2.0"

keywords:
  - prometheus
  - grafana
  - kube-prometheus-stack
  - metrics
  - observability

dependencies:
  # Brings Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics, and
  # the CRDs (ServiceMonitor, PodMonitor, PrometheusRule) in one chart. Same dependency
  # version already proven out on this cluster in
  # ../../k8s_explorer/rust-api-observability-stack/Chart.yaml.
  - name: kube-prometheus-stack
    version: "88.2.0"
    repository: "https://prometheus-community.github.io/helm-charts"
