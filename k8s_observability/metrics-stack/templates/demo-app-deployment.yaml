{{- if .Values.demoApp.enabled }}
{{/*
`release: {{ .Release.Name }}` on top of the plain `app: demo-app` label —
log-stack/trace-stack ship a demo app with the exact same `app: demo-app` label, and
when multiple of these releases share a namespace (verified live: all three installed
into `default`), a selector on `app: demo-app` alone matches pods across ALL of them.
Confirmed via `kubectl get endpointslices` before this was added: this Service was
serving traffic from log-stack's demo-app pod too, which doesn't even listen on this
port. The release label makes the selector unambiguous regardless of what else is
installed alongside it.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.demoApp.name }}
  labels:
    app: {{ .Values.demoApp.name }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.demoApp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.demoApp.name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.demoApp.name }}
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Values.demoApp.name }}
          image: "{{ .Values.demoApp.image.repository }}:{{ .Values.demoApp.image.tag }}"
          imagePullPolicy: {{ .Values.demoApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.demoApp.resources | nindent 12 }}
{{- end }}
