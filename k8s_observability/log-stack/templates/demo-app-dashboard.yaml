{{- if .Values.demoApp.enabled }}
{{- $lsk := index .Values "loki-stack" }}
{{/*
Ships every dashboard in dashboards/ as a ConfigMap carrying the label the Grafana
sidecar watches (loki-stack.grafana.sidecar.dashboards, enabled in values.yaml with
searchNamespace: ALL) — appears in Grafana with no manual JSON import.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-demo-app-dashboards
  labels:
    {{ $lsk.grafana.sidecar.dashboards.label }}: {{ $lsk.grafana.sidecar.dashboards.labelValue | quote }}
data:
  {{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
