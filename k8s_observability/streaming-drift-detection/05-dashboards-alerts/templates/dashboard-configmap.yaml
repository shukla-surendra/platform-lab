{{/*
Same pattern as ../../metrics-stack/templates/demo-app-dashboard.yaml:
ships every dashboard in dashboards/ as a ConfigMap carrying the label the
Grafana sidecar watches (grafana.sidecar.dashboards, enabled in
values.yaml) — appears in Grafana with no manual JSON import. .Files.Glob
rather than one .Files.Get per file so adding a dashboard is just dropping
a .json into dashboards/, no template edit needed.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-drift-dashboards
  labels:
    {{ .Values.grafana.sidecar.dashboards.label }}: {{ .Values.grafana.sidecar.dashboards.labelValue | quote }}
data:
  {{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
