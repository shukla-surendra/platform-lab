# Production simulation: every process that shares one Python venv in local dev becomes its own
# container here, talking over a real network instead of stdio/shared-filesystem shortcuts.
#
#   ollama            -- the LLM + embeddings backend, its own service, as it would be in prod
#   ollama-pull        -- one-shot init job: pulls the two models, then exits
#   ops-server         -- MCP server (streamable-http), owns world_state.json, mutating-tool gate
#                         fixed for its whole lifetime by APPLY_CHANGES (see .env / below)
#   knowledge-server   -- MCP server (streamable-http), owns the FAISS index, read-only
#   agent              -- runs daemon.py (automode) by default, connects to both MCP servers and
#                         Ollama purely by URL/hostname -- no stdio, no shared Python process
#   cli                -- same image/network/volumes as `agent`, no fixed command; for one-shot
#                         work (`agent_cli.py`, `seed.py`, `events/simulate.py`) via `docker
#                         compose run`. Not started by `docker compose up` (profile: tools).
#
# See README.md's "Docker / production simulation" section for the full walkthrough and for why
# the dry-run gate (--apply) works differently here than in local stdio mode.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["sh", "-c"]
    command:
      - "ollama pull ${OLLAMA_MODEL:-qwen3.5:latest} && ollama pull ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}"
    restart: "no"

  ops-server:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      MCP_TRANSPORT: http
      OPS_SERVER_HOST: "0.0.0.0"
      OPS_SERVER_PORT: "8001"
      STATE_FILE: /app/data/world_state.json
      AUDIT_LOG_FILE: /app/data/audit_log.jsonl
      # This is the real dry-run gate in production mode -- fixed for the container's lifetime.
      # Flip it and `docker compose up -d --force-recreate ops-server` to change it; there is no
      # per-request client override, deliberately (see mcp_client.py's build_client()).
      APPLY_CHANGES: "${APPLY_CHANGES:-false}"
    volumes:
      - agent-data:/app/data
    entrypoint: ["/app/docker/ops_entrypoint.sh"]
    ports:
      - "8001:8001"

  knowledge-server:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      MCP_TRANSPORT: http
      KNOWLEDGE_SERVER_HOST: "0.0.0.0"
      KNOWLEDGE_SERVER_PORT: "8002"
      FAISS_INDEX_DIR: /app/data/faiss_index
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}"
    volumes:
      - agent-data:/app/data
    entrypoint: ["/app/docker/knowledge_entrypoint.sh"]
    ports:
      - "8002:8002"

  agent:
    build: .
    depends_on:
      - ops-server
      - knowledge-server
    environment:
      MCP_TRANSPORT: http
      OPS_SERVER_URL: "http://ops-server:8001/mcp"
      KNOWLEDGE_SERVER_URL: "http://knowledge-server:8002/mcp"
      OPS_SERVER_PORT: "8001"
      KNOWLEDGE_SERVER_PORT: "8002"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:latest}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      STATE_FILE: /app/data/world_state.json
      AUDIT_LOG_FILE: /app/data/audit_log.jsonl
    volumes:
      - agent-data:/app/data
      - ./events:/app/events
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["python", "daemon.py"]

  cli:
    build: .
    profiles: ["tools"]
    depends_on:
      - ops-server
      - knowledge-server
    environment:
      MCP_TRANSPORT: http
      OPS_SERVER_URL: "http://ops-server:8001/mcp"
      KNOWLEDGE_SERVER_URL: "http://knowledge-server:8002/mcp"
      OPS_SERVER_PORT: "8001"
      KNOWLEDGE_SERVER_PORT: "8002"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3.5:latest}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      STATE_FILE: /app/data/world_state.json
      AUDIT_LOG_FILE: /app/data/audit_log.jsonl
    volumes:
      - agent-data:/app/data
      - ./events:/app/events
    entrypoint: ["/app/docker/entrypoint.sh"]

volumes:
  ollama-models:
  agent-data:
