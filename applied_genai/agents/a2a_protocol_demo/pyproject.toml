[project]
name = "a2a-protocol-demo"
version = "0.1.0"
description = "Two agents talking to each other over the real A2A protocol, plus a human-facing client"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.1.0",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "httpx>=0.27",
    "langchain-ollama>=0.2",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
