services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag_pgvector_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-rag}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-rag}
      POSTGRES_DB: ${PGVECTOR_DB:-rag}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-rag} -d ${PGVECTOR_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgvector_data:
