# Port 5435 -- 5433 is sql_postgres_practice, 5434 is pg_locks.
services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=lab
      - POSTGRES_PASSWORD=lab
      - POSTGRES_DB=shop
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d shop"]
      interval: 2s
      timeout: 5s
      retries: 10
