# Port 5433 (not 5432) -- avoids colliding with a Postgres already running
# locally or in another project's docker-compose (e.g. personal_assistant's
# `db` service already claims 5432).
services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=practice
      - POSTGRES_PASSWORD=practice
      - POSTGRES_DB=practice
    ports:
      - "5433:5432"
    volumes:
      - sql_practice_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sql_practice_data:
