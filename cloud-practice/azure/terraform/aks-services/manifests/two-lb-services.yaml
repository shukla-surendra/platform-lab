# The experiment: two Services of type LoadBalancer.
# Question: does this create two Azure Load Balancers?
apiVersion: v1
kind: Service
metadata:
  name: web-lb-a
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-lb-b
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 80
