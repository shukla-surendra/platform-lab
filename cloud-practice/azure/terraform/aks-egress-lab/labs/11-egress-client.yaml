# A long-running client Pod to run egress tests from (kubectl exec). Labelled app=egress-client so NetworkPolicies select it.
apiVersion: v1
kind: Pod
metadata:
  name: egress-client
  namespace: lab
  labels:
    app: egress-client
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sleep", "7200"]
