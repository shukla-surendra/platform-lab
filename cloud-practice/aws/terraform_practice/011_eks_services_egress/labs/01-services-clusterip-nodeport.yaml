# Free to run: neither of these creates anything in Azure.
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: lab
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: lab
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
