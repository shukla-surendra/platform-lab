# STEP 1 of the egress NetworkPolicy exercise: block ALL outbound traffic from Pods labelled app=egress-client.
# An empty "egress" list with policyTypes: [Egress] means "nothing is allowed out", including DNS.
# Needs a network policy engine: on this EKS cluster it is the VPC CNI add-on's built-in one (enableNetworkPolicy = "true" in 04_nodes.tf).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: egress-client
  policyTypes:
  - Egress
