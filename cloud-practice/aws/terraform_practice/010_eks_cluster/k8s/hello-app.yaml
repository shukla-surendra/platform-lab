# A small web app: 2 nginx pods behind a ClusterIP Service.
# Apply:  kubectl --kubeconfig ~/.kube/eks-lab.config apply -f k8s/hello-app.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# Custom page, mounted into nginx
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-html
  namespace: demo
data:
  index.html: |
    <h1>Hello from EKS</h1>
    <p>Served by an nginx pod on a managed node group.</p>
---
# Deployment: keeps 2 identical pods running and replaces them if they die
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: hello-html
---
# Service: stable internal IP/DNS (hello.demo.svc) load-balancing across the pods.
# ClusterIP = reachable only inside the cluster (free). Use type: LoadBalancer
# to get a public AWS load balancer (costs money).
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: demo
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
