x-cassandra-common: &cassandra-common
  image: cassandra:5.0
  # NOT restart: on-failure -- deliberately. If a node's Cassandra process
  # exits during bootstrap, it has typically already flushed SOME local
  # system-table state (system.local, system.peers) to its data directory
  # before dying. Restarting the SAME container reuses that same,
  # now-partially-written data dir -- confirmed hitting exactly this: a
  # node that failed on a "Bootstrap Token collision" (see below) got
  # auto-restarted, and its own half-registered prior gossip state then
  # collided with itself ("A node with address ... already exists,
  # cancelling join") -- a second, self-inflicted failure caused BY the
  # auto-restart, not fixed by it. Leaving this off means a real failure
  # surfaces once, clearly -- `docker compose down -v && docker compose
  # up -d` (wiping data dirs via -v) is the correct retry, not an
  # in-place restart.
  #
  # Docker Desktop on a typical dev machine (~8GB total) OOM-killed a node
  # running with NO heap limit set -- Cassandra's JVM auto-sizes its heap
  # off total host memory, not the container's limit, so each node tried
  # to claim a large heap independently. mem_limit + MAX_HEAP_SIZE below
  # fixes that.
  mem_limit: 1200m
  environment: &cassandra-common-env
    CASSANDRA_CLUSTER_NAME: lab-cluster
    # Every node lists the same seed(s) -- seeds are only a bootstrap
    # rendezvous point (how a new node finds the gossip ring at all), not
    # a leader/coordinator. Once gossip has propagated, seed vs. non-seed
    # makes no difference to how a node behaves.
    CASSANDRA_SEEDS: cassandra-1
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    MAX_HEAP_SIZE: 500M
    # Cassandra 5's replication-factor-aware vnode token allocation (on
    # by default) can, rarely, generate the exact same token for two
    # nodes bootstrapping close together when num_tokens is low --
    # confirmed hitting "Bootstrap Token collision between ... (token ...)"
    # directly at the default of 16. 256 (Cassandra's traditional
    # pre-4.0 default) gives the allocator far more entropy to pick from,
    # making that collision astronomically less likely -- purely a
    # token-space-size fix, unrelated to node/cluster count.
    CASSANDRA_NUM_TOKENS: 256
  healthcheck:
    # Healthy once nodetool reports at least one node Up/Normal -- for
    # cassandra-1 that's itself after its own bootstrap; for cassandra-2/3
    # it's true once THEY finish joining the ring, not just once cassandra-1
    # is reachable -- which is what depends_on: condition: service_healthy
    # below actually waits on.
    test: ["CMD-SHELL", "nodetool status 2>/dev/null | grep -q '^UN'"]
    interval: 15s
    timeout: 10s
    retries: 30
    start_period: 60s
  networks: [cassandra-net]

services:
  # Bootstrapping nodes one at a time (via depends_on/service_healthy
  # below) avoids every node racing to be the first to gossip -- Cassandra
  # nodes CAN start concurrently, but sequential joins are the standard,
  # boring, reliable way to bring up a fresh cluster.
  cassandra-1:
    <<: *cassandra-common
    container_name: cassandra-lab-1
    ports:
      - "9042:9042"

  cassandra-2:
    <<: *cassandra-common
    container_name: cassandra-lab-2
    depends_on:
      cassandra-1:
        condition: service_healthy
    ports:
      - "9043:9042"

  cassandra-3:
    <<: *cassandra-common
    container_name: cassandra-lab-3
    depends_on:
      cassandra-2:
        condition: service_healthy
    ports:
      - "9044:9042"

  # Same reason as the Redis Cluster lab's `client` service
  # (../redis/cluster/README.md "Why a client container"): the Python
  # driver discovers full cluster topology from one contact point, then
  # opens connections to every node by the address THEY gossip about
  # themselves -- inside this compose network, that's their container
  # hostnames (cassandra-1/2/3), not reachable from the host machine.
  client:
    image: python:3.12-slim
    container_name: cassandra-lab-client
    depends_on:
      cassandra-3:
        condition: service_healthy
    networks: [cassandra-net]
    volumes:
      - ./examples:/examples:ro
    working_dir: /examples
    entrypoint: sh -c "pip install --quiet cassandra-driver && tail -f /dev/null"

networks:
  cassandra-net:
    driver: bridge
