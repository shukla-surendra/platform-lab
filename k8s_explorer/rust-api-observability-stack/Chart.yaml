apiVersion: v2
name: rust-sqlite-api-stack
description: rust-api (stateless HTTP test server — health check, log generation, httpbin-style endpoints) plus its own Prometheus, Grafana, Loki, and dashboards
type: application

# Chart version moves independently of the app; appVersion tracks the image tag.
# Chart name/directory kept as rust-sqlite-api-stack — see CHANGELOG.md for why
# it was not renamed alongside the app (rust-sqlite-api -> rust-api).
version: 0.2.0
appVersion: "1.0.0"

home: https://hub.docker.com/r/surendrashukla29/rust-api
keywords:
  - grafana
  - prometheus
  - loki
  - observability
  - rust
  - httpbin

dependencies:
  # Brings Prometheus, Grafana, and the CRDs (ServiceMonitor, PrometheusRule)
  # that this chart's own templates reference. Without it those templates
  # would render objects the API server rejects as unknown kinds.
  - name: kube-prometheus-stack
    version: "88.2.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled

  # ON by default — Loki + Promtail. See values.yaml for why.
  - name: loki-stack
    version: "2.10.3"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki-stack.enabled
