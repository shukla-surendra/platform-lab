{{- if .Values.prometheusRule.enabled }}
{{/*
Alerts are on symptoms the operator can act on, not on every counter that
exists. Each one names what to do, because an alert that only says a number
moved gets silenced within a week.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "rust-sqlite-api-stack.fullname" . }}
  labels:
    {{- include "rust-sqlite-api-stack.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: rust-sqlite-api
      rules:
        - alert: CollectorDown
          expr: up{job=~".*rust-sqlite-api.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "rust-sqlite-api is not scrapeable"
            description: >-
              Nothing is being collected. Every other alert here is silent while
              this one fires, because their metrics come from the dead target.

        - alert: TelemetryDropping
          expr: |
            sum(rate(telemetry_dropped_total[5m]))
              / clamp_min(sum(rate(telemetry_received_total[5m])), 0.0001) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Shedding >1% of accepted telemetry"
            description: >-
              Ingest is outrunning the disk and the bounded queue is full. This
              is designed behaviour under overload, not a crash — but the data
              is genuinely gone. Raise INGEST_QUEUE_CAPACITY to absorb bursts,
              raise INGEST_BATCH_MAX for sustained load, or send less.

        - alert: WriteQueueSaturated
          expr: telemetry_queue_depth / clamp_min(telemetry_queue_capacity, 1) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Writer queue over 80% full"
            description: >-
              The leading indicator — this fires before TelemetryDropping does.
              Acting here means losing nothing; waiting means losing records.

        - alert: WriteErrors
          expr: increase(telemetry_write_errors_total[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Batch commits are failing"
            description: >-
              Should be exactly zero in normal operation. Check the volume for
              disk-full first, then for a corrupted database file.

        - alert: WriterSaturated
          expr: sum(rate(telemetry_write_seconds_total[5m])) > 0.8
          for: 10m
          labels:
            severity: warning

          annotations:
            summary: "Writer task spending >80% of wall clock committing"
            description: >-
              SQLite has become the bottleneck. Below this level the cost is
              elsewhere (JSON parsing), and tuning the database buys nothing —
              which is why this threshold exists rather than a raw latency one.

        - alert: ExporterRetryStorm
          expr: |
            sum(rate(telemetry_deduped_total[5m]))
              / clamp_min(sum(rate(telemetry_received_total[5m])), 0.0001) > 0.25
          for: 15m
          labels:
            severity: info
          annotations:
            summary: "Over a quarter of spans are re-deliveries"
            description: >-
              Nothing is being lost — the uniqueness constraint absorbs these.
              But exporters only retry when they think delivery failed, so this
              points at timeouts or network trouble upstream of the collector.
{{- end }}
