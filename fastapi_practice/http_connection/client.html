<script>
    async function fetchData() {
        try {
            const response = await fetch('http://localhost:8000/request');   
            const data = await response.json();
            console.log(data);
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    } 
    fetchData()
    </script>
