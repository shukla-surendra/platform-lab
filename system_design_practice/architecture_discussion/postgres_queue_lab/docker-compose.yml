# Postgres (+ a web UI) for the scripts in this folder.
#   docker compose up -d        start everything
#   docker compose ps           wait until postgres shows "healthy"
#   docker compose down -v      stop and delete all data

services:
  postgres:
    image: postgres:17
    container_name: lab-postgres
    command: ["postgres", "-c", "max_connections=200"]   # race_test.py opens 50+ connections at once
    ports:
      - "55433:5432"                      # what the Python scripts connect to (not 5432, to avoid a local Postgres)
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:5                      # web UI: http://localhost:8081 (not 8080, which the Kafka UI uses)
    container_name: lab-postgres-ui
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres    # login form is pre-filled with this server
    depends_on:
      postgres:
        condition: service_healthy
